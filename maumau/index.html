<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mau-Mau Fuchsschule</title>
  <meta name="description" content="Captain Fuchsschule - Kartenspiele im Browser">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/maumau/maumau.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="/index.html">Fuchsschule</a>
    <nav aria-label="Hauptnavigation">
      <ul class="nav-list">
        <li><a href="/index.html">Start</a></li>
        <li><a href="/maumau/index.html" aria-current="page">Mau-Mau</a></li>
        <!-- Spiele-Links kommen später, z. B. Mau-Mau -->
      </ul>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dunkles Design umschalten">
      🌓
    </button>
  </header>

  <main class="container">
    <h1>Mau-Mau</h1>
    <p>Runde Starten</p>
    <div id="game"></div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Captain Fuchsschule</p>
  </footer>

  <script>
    // Dark Mode: gespeicherte Auswahl laden, sonst Systemeinstellung nutzen
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const saved = localStorage.getItem('theme');
    if (saved) root.dataset.theme = saved;

    toggle.addEventListener('click', () => {
      const isDark = root.dataset.theme === 'dark' ||
        (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
      const next = isDark ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('theme', next);
    });

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script type="module" src="display.js"></script>

</body>
</html>
